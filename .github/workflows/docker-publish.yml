name: Deploy Frontend Private to GHCR

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "owner_lowercase=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set Build Configuration
        id: config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "dockerfile=./Dockerfile" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          push: true
          tags: |
            ghcr.io/cursala2026/frontend-cursala-private:${{ steps.config.outputs.tag }}
            ghcr.io/cursala2026/frontend-cursala-private:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            API_URL=https://app.cursala.com.ar/api/v1

      - name: Verify pushed manifests
        run: |
          for t in "${{ steps.config.outputs.tag }}" "${{ github.sha }}"; do
            if ! docker manifest inspect ghcr.io/cursala2026/frontend-cursala-private:$t > /dev/null 2>&1; then
              echo "Manifest for $t not found"; exit 1
            fi
          done
