<div class="h-full flex flex-col pt-4 pb-4">
  <!-- Header Section -->
  <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-5 rounded-2xl shadow-xl mb-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-white mb-1">Notificaciones 📧</h1>
          <p class="text-blue-100 text-sm">Configura y gestiona las notificaciones por email que se envían a los usuarios</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="bg-white border border-gray-200 rounded-t-xl shadow-sm">
    <div class="flex">
      <button
      type="button"
      (click)="setActiveTab('course')"
      [class.bg-indigo-50]="activeTab() === 'course'"
      [class.border-indigo-600]="activeTab() === 'course'"
      class="flex-1 px-6 py-3 font-medium text-gray-700 hover:text-gray-900 transition-colors border-b-2 border-gray-200 flex items-center justify-center gap-2"
      >
      <span [class.text-indigo-600]="activeTab() === 'course'">Curso</span>
      </button>
      <button
      type="button"
      (click)="setActiveTab('no-enrollment')"
      [class.bg-purple-50]="activeTab() === 'no-enrollment'"
      [class.border-purple-600]="activeTab() === 'no-enrollment'"
      class="flex-1 px-6 py-3 font-medium text-gray-700 hover:text-gray-900 transition-colors border-b-2 border-gray-200 flex items-center justify-center gap-2"
      >
      <span [class.text-purple-600]="activeTab() === 'no-enrollment'">No inscriptos</span>
      </button>
    </div>
  </div>

  <!-- Tab Content -->
  <div class="bg-white border border-t-0 border-gray-200 rounded-b-xl shadow-sm p-3 flex-1 flex flex-col overflow-hidden min-h-0">
    @if (activeTab() === 'course') {
      <app-course-start class="flex-1 flex flex-col min-h-0"></app-course-start>
    }
    @if (activeTab() === 'no-enrollment') {
      <app-no-enrollment class="flex-1 flex flex-col min-h-0"></app-no-enrollment>
    }
  </div>
</div>
