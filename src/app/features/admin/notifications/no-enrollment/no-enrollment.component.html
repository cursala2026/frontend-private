<form [formGroup]="form" (ngSubmit)="save()" class="flex-1 flex flex-col overflow-hidden">
    
    <div class="flex-1 overflow-y-auto p-4 space-y-4 min-h-0">
        <!-- Configuración -->
        <label class="flex items-center gap-2">
            <input type="checkbox" formControlName="enabled" />
            <span>Habilitar envío</span>
        </label>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Remitente</label>
            <input type="email" formControlName="sender"
            class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Plantilla</label>
            <textarea formControlName="template" rows="6"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"></textarea>
            <div class="preview mt-2 p-3 border rounded bg-gray-50">
                <h4 class="font-semibold">Vista previa</h4>
                <div class="text-gray-700">{{ form.value.template }}</div>
            </div>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Ventana horaria</label>
            <input type="text" formControlName="timeWindow"
            class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" />
        </div>
        
        <!-- Métricas -->
        <div class="mt-4 p-3 border rounded bg-gray-50">
            <h4 class="font-semibold">Usuarios sin inscripción</h4>
            <p>Total: {{ usersWithoutEnrollment.length }}</p>
            <ul class="list-disc pl-5 text-sm text-gray-700">
                <li *ngFor="let user of usersWithoutEnrollment">
                    {{ user.name }} - {{ user.email }}
                </li>
            </ul>
        </div>
    </div>
    
    <!-- Botones -->
    <div class="flex gap-3 justify-end pt-3 border-t border-gray-200 flex-shrink-0 bg-white px-4">
        <button type="button"
        class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-100 transition-all cursor-pointer"
        [disabled]="saving()">Cancelar</button>
        <button type="submit"
        class="px-6 py-3 bg-gradient-to-r from-purple-600 to-purple-500 text-white rounded-lg font-medium hover:from-purple-700 hover:to-purple-600 transition-all disabled:opacity-50 cursor-pointer"
        [disabled]="!form.valid || saving()">Guardar</button>
        <button type="button"
        class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-all cursor-pointer"
        (click)="sendTest()">Enviar prueba</button>
    </div>
</form>
